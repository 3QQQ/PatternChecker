name: Publish Minecraft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release assets
        uses: actions/checkout@v5

      - name: Validate release bundle
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd "release-assets/$version"
          test -f "patternchecker-mc1.20.1-$version.jar"
          test -f "patternchecker-mc1.21.1-$version.jar"
          test -f RELEASE-NOTES.md
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: Kira-NT/mc-publish@v3
        with:
          files: release-assets/${{ steps.release.outputs.version }}/*.jar
          name: Pattern Checker ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: release-assets/${{ steps.release.outputs.version }}/RELEASE-NOTES.md
          loaders: |
            forge
            neoforge
          game-versions: |
            1.20.1
            1.21.1
          environment: client | server
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-draft: false
          github-prerelease: false
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish Minecraft 1.20.1 Forge to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release-assets/${{ steps.release.outputs.version }}/patternchecker-mc1.20.1-${{ steps.release.outputs.version }}.jar
          name: Pattern Checker ${{ steps.release.outputs.version }} for Minecraft 1.20.1 Forge
          version: ${{ steps.release.outputs.version }}+mc1.20.1
          version-type: release
          changelog-file: release-assets/${{ steps.release.outputs.version }}/RELEASE-NOTES.md
          loaders: forge
          game-versions: 1.20.1
          environment: client | server
          curseforge-id: "1653507"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish Minecraft 1.21.1 NeoForge to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release-assets/${{ steps.release.outputs.version }}/patternchecker-mc1.21.1-${{ steps.release.outputs.version }}.jar
          name: Pattern Checker ${{ steps.release.outputs.version }} for Minecraft 1.21.1 NeoForge
          version: ${{ steps.release.outputs.version }}+mc1.21.1
          version-type: release
          changelog-file: release-assets/${{ steps.release.outputs.version }}/RELEASE-NOTES.md
          loaders: neoforge
          game-versions: 1.21.1
          environment: client | server
          curseforge-id: "1653507"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          retry-attempts: 3
          retry-delay: 10000
