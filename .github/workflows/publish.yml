name: Publish Minecraft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release assets
        uses: actions/checkout@v5

      - name: Publish GitHub Release
        uses: Kira-NT/mc-publish@v3
        with:
          files: release-assets/*.jar
          name: Pattern Checker ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            forge
            neoforge
          game-versions: |
            1.20.1
            1.21.1
          environment: client | server
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-draft: false
          github-prerelease: false
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish Minecraft 1.20.1 Forge to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release-assets/patternchecker-mc1.20.1-*.jar
          name: Pattern Checker 1.0.3 for Minecraft 1.20.1 Forge
          version: 1.0.3+mc1.20.1
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: forge
          game-versions: 1.20.1
          environment: client | server
          curseforge-id: "1653507"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish Minecraft 1.21.1 NeoForge to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release-assets/patternchecker-mc1.21.1-*.jar
          name: Pattern Checker 1.0.3 for Minecraft 1.21.1 NeoForge
          version: 1.0.3+mc1.21.1
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          environment: client | server
          curseforge-id: "1653507"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          retry-attempts: 3
          retry-delay: 10000
